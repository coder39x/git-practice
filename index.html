
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8ddff">
  <title>Welcome to AMSA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #10265e;
      --muted: #48648e;
      --blue: #1764f5;
      --purple: #743cff;
      --pink: #f04fbd;
      --font-head: "Poppins", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .welcome {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        max(35px, env(safe-area-inset-top))
        22px
        max(32px, env(safe-area-inset-bottom));

      background:
        radial-gradient(ellipse at 15% 15%,
          rgba(255,255,255,.95), transparent 37%),
        radial-gradient(ellipse at 88% 24%,
          rgba(255,255,255,.82), transparent 34%),
        radial-gradient(ellipse at 48% 55%,
          rgba(222,241,255,.95), transparent 52%),
        linear-gradient(180deg,
          #a8d4ff 0%,
          #d2eaff 35%,
          #eaf5ff 66%,
          #dbeaff 100%);
    }

    /* Soft cloud shapes, drawn entirely with CSS */
    .cloud {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border-radius: 100px;
      background: rgba(255,255,255,.62);
      filter: blur(2px);
      box-shadow:
        25px -17px 0 4px rgba(255,255,255,.48),
        53px -4px 0 9px rgba(255,255,255,.38),
        78px 5px 0 0 rgba(255,255,255,.28);
      animation: drift 22s ease-in-out infinite alternate;
    }

    .cloud-one {
      width: 85px;
      height: 28px;
      top: 10%;
      left: -12px;
    }

    .cloud-two {
      width: 110px;
      height: 34px;
      top: 27%;
      right: 4%;
      opacity: .65;
      animation-delay: -8s;
    }

    .cloud-three {
      width: 75px;
      height: 25px;
      top: 48%;
      left: 5%;
      opacity: .55;
      animation-delay: -12s;
    }

    .cloud-four {
      width: 95px;
      height: 29px;
      top: 7%;
      right: 13%;
      opacity: .5;
      animation-delay: -4s;
    }

    .sun-glow {
      position: absolute;
      z-index: -1;
      top: 8%;
      left: 50%;
      width: 310px;
      height: 310px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255,255,255,.32);
      filter: blur(55px);
      pointer-events: none;
    }

    /* Rainbow artwork: no external image required */
    .rainbow {
      position: absolute;
      z-index: -1;
      bottom: -1px;
      left: 50%;
      width: max(125%, 500px);
      max-width: 1000px;
      height: auto;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .rainbow-glow {
      opacity: .42;
      filter: blur(19px);
    }

    .rainbow-colours {
      opacity: .55;
    }

    .rainbow path {
      fill: none;
      stroke-width: 25;
      stroke-linecap: round;
    }

    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 35px 0 28px;
      animation: appear .8s ease-out both;
    }

    .logo {
      display: block;
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(24,88,230,.25));
    }

    h1 {
      width: 100%;
      white-space: nowrap;
      font-family: var(--font-head);
      font-size: clamp(1.55rem, 6.5vw, 3.3rem);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.055em;
      color: #10265e;
      text-shadow: 0 2px 0 rgba(255,255,255,.35);
    }

    .tagline {
      font-size: clamp(.95rem, 3.7vw, 1.12rem);
      line-height: 1.6;
      font-weight: 500;
      color: #405d87;
      letter-spacing: .01em;
      margin-top: -7px;
    }

    .actions {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      display: grid;
      gap: 15px;
      padding-bottom: clamp(20px, 5vh, 55px);
      animation: appear .8s ease-out .2s both;
    }

    .btn {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 15px 22px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 18px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .01em;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 15%,
        rgba(255,255,255,.3) 45%,
        transparent 70%
      );
      transform: translateX(-110%);
      transition: transform .6s ease;
    }

    .btn:hover::before {
      transform: translateX(110%);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .signup {
      color: white;
      background: linear-gradient(120deg, #2477ff, #3454f5 52%, #783eff);
      box-shadow:
        0 12px 28px rgba(40,94,244,.35),
        inset 0 1px 0 rgba(255,255,255,.4);
    }

    .signup:hover {
      box-shadow: 0 16px 34px rgba(40,94,244,.48);
      transform: translateY(-2px);
    }

    .login {
      color: #173c9b;
      background: linear-gradient(120deg,
        rgba(255,255,255,.92),
        rgba(210,230,255,.96));
      box-shadow:
        0 10px 24px rgba(51,105,200,.16),
        inset 0 1px 0 white;
      border-color: rgba(255,255,255,.8);
    }

    .login:hover {
      box-shadow: 0 13px 28px rgba(51,105,200,.24);
      transform: translateY(-2px);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift {
      from { translate: -8px 0; }
      to { translate: 18px 5px; }
    }

    @media (min-width: 600px) {
      .welcome {
        padding-left: 40px;
        padding-right: 40px;
      }

      .hero {
        gap: 21px;
      }

      .logo {
        width: 112px;
        height: 112px;
      }

      h1 {
        font-size: clamp(2.4rem, 5vw, 3.5rem);
      }

      .actions {
        padding-bottom: 50px;
      }
    }

    @media (max-width: 340px) {
      .welcome {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 1.45rem;
        letter-spacing: -.06em;
      }

      .logo {
        width: 78px;
        height: 78px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="welcome">
    <div class="sun-glow" aria-hidden="true"></div>
    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>
    <div class="cloud cloud-three" aria-hidden="true"></div>
    <div class="cloud cloud-four" aria-hidden="true"></div>

    <svg class="rainbow rainbow-glow"
         viewBox="0 0 400 200"
         aria-hidden="true">
      <path d="M24 200 A176 176 0 0 1 376 200" stroke="#ff5268"/>
      <path d="M48 200 A152 152 0 0 1 352 200" stroke="#ff9f43"/>
      <path d="M72 200 A128 128 0 0 1 328 200" stroke="#ffe15b"/>
      <path d="M96 200 A104 104 0 0 1 304 200" stroke="#51dba0"/>
      <path d="M120 200 A80 80 0 0 1 280 200" stroke="#5295ff"/>
      <path d="M144 200 A56 56 0 0 1 256 200" stroke="#aa83ff"/>
    </svg>

    <svg class="rainbow rainbow-colours"
         viewBox="0 0 400 200"
         aria-hidden="true">
      <path d="M24 200 A176 176 0 0 1 376 200" stroke="#ff5268"/>
      <path d="M48 200 A152 152 0 0 1 352 200" stroke="#ff9f43"/>
      <path d="M72 200 A128 128 0 0 1 328 200" stroke="#ffe15b"/>
      <path d="M96 200 A104 104 0 0 1 304 200" stroke="#51dba0"/>
      <path d="M120 200 A80 80 0 0 1 280 200" stroke="#5295ff"/>
      <path d="M144 200 A56 56 0 0 1 256 200" stroke="#aa83ff"/>
    </svg>

    <section class="hero">
      <img
        class="logo"
        src="amsa-logo.png"
        alt="AMSA logo"
        onerror="this.style.display='none'"
      >

      <h1>Welcome to AMSA</h1>
      <p class="tagline">Your learning gateway</p>
    </section>

    <nav class="actions" aria-label="Get started">
      <a class="btn signup" href="/signup">Sign up</a>
      <a class="btn login" href="/login">Log in</a>
    </nav>
  </main>
</body>
</html>
